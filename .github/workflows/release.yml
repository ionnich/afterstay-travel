name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# One release build at a time — cancel a queued/stale run on a new push so
# release tags stay ordered and don't race each other.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
      EXPO_PUBLIC_WS_URL: ${{ secrets.EXPO_PUBLIC_WS_URL }}
      EXPO_PUBLIC_COGNITO_USER_POOL_ID: ${{ secrets.EXPO_PUBLIC_COGNITO_USER_POOL_ID }}
      EXPO_PUBLIC_COGNITO_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_COGNITO_CLIENT_ID }}
      EXPO_PUBLIC_COGNITO_OAUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_COGNITO_OAUTH_DOMAIN }}
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_MAPS_SDK_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_SDK_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Install the exact SDK/NDK the project needs so gradle never auto-downloads them.
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006"

      # android/ is gitignored (CNG) — generate it before building.
      - name: Prebuild Android project
        run: npx expo prebuild --platform android --no-install

      # Build arm64 only (covers all modern devices + Apple Silicon emulators),
      # 4× faster than the default 4-ABI build; bump gradle memory for the CI runner.
      - name: Optimize build (arm64 only, more heap)
        run: |
          sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a/' android/gradle.properties
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m/' android/gradle.properties

      - name: Build release APK
        run: cd android && ./gradlew assembleRelease

      - name: Rename APK for stable download URL
        run: cp android/app/build/outputs/apk/release/app-release.apk AfterStay.apk

      - name: Read app version
        id: version
        run: echo "version=$(node -p "require('./app.json').expo.version")" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-${{ github.run_number }}
          name: v${{ steps.version.outputs.version }} (build ${{ github.run_number }})
          files: AfterStay.apk
          generate_release_notes: true
